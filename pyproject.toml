[project]
name = "daylog"
version = "0.1.0"
description = "Persoonlijk dagboek uit audio: iPhone neemt op, laptop transcribeert, herkent sprekers en vat samen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Zware ML-stack, alleen nodig op de Mac die de batch draait (niet in CI).
ml = [
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "pyannote.audio>=3.1,<4",
]

[project.scripts]
daylog = "daylog.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daylog"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["–"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

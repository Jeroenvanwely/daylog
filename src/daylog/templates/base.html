<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}daylog{% endblock %}</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --line:#e4e1da; --accent:#2f6f5e; --mark:#f5e2a8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --fg:#ecebe6; --muted:#9a988f; --line:#2c2b28; --accent:#7cc4ad; --mark:#5c4b14; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  nav { display:flex; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  nav a { color:var(--fg); text-decoration:none; font-weight:600; }
  nav form { margin-left:auto; flex:1; max-width:280px; }
  input[type=search], input[type=text], select { width:100%; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  a { color: var(--accent); }
  h1 { font-size:1.4rem; margin:8px 0 12px; } h2 { font-size:1.05rem; margin:0; }
  .muted { color:var(--muted); font-size:.9rem; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; }
  .tag { display:inline-block; font-size:.75rem; padding:1px 8px; border-radius:99px; border:1px solid var(--line); margin-right:4px; }
  .seg { display:grid; grid-template-columns: 3.2rem 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .who { font-weight:600; }
  mark { background:var(--mark); color:inherit; }
  button { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .row > * { flex: 1 1 140px; }
</style>
</head>
<body>
<nav>
  <a href="/">Logboek</a>
  <a href="/speakers">Sprekers</a>
  <form action="/search"><input type="search" name="q" placeholder="Zoeken…" value="{{ q or '' }}"></form>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
